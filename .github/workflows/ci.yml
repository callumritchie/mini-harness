name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python tests/test_loop.py
      - run: python tests/test_tools.py
      - run: python tests/test_server.py
      - run: python tests/test_rag.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Install, typecheck, unit-test and build the UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Browser tests (the real server with the scripted demo model)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
