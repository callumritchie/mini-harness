[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harness"
version = "0.1.0"
description = "A small coding agent for Claude and DeepSeek, with a terminal mode and a local web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.79"]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "numpy>=1.24"]
rag = ["fastembed>=0.5", "numpy>=1.24"]  # the local embedding model for search by meaning (downloaded only on /index --embed)

[project.scripts]
mini-harness = "agent:main"

[tool.setuptools]
py-modules = ["agent", "compaction", "context", "controller", "demo", "embed", "goal", "graph", "judge", "mcp", "permissions", "pricing",
              "rag", "safety", "session", "sessionlog", "skills", "terminal", "tools", "webserver"]
